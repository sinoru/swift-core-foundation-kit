# Builds the package for every Apple platform it declares support for, through the Xcode build
# system, and runs its tests wherever a runner can boot the destination. This package supports
# Apple platforms only, so this one workflow is the whole matrix.
#
# It also runs the benchmarks, on macOS. That is the one place the package is built by SwiftPM
# rather than by Xcode, and the one place a package depending on it is stood in for: the
# benchmarks are a module of their own, so they read the library across the module boundary the
# way a client does.

name: Apple Platforms

# Pushes only fire on the branches git-flow keeps around; feature branches are covered by the
# pull_request trigger. Only a change that can alter what is built here runs it: a commit to the
# README runs nothing.
on:
  push:
    branches: [main, develop, "release/**", "hotfix/**"]
    paths: &paths
      - Sources/**
      - Tests/**
      - Benchmarks/**
      - Package.swift
      - .github/workflows/apple-platforms.yml
  pull_request:
    branches: [main, develop, "release/**", "hotfix/**"]
    paths: *paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Both configurations, and the tests in both. Nothing here uses `@testable import`, so Release
  # builds them as well as Debug does, and Release is the one that matters: it is the library as
  # a client gets it, and the payloads are taken with a cast that is only checked in Debug.
  #
  # macOS is the only row that runs the proxy test: the proxy it needs is in no other platform's
  # Foundation. What that test covers is one line the other rows compile unchanged.
  apple-platforms:
    uses: sinoru/github-workflows/.github/workflows/apple-platforms.yml@main
    with:
      scheme: CoreFoundationKit
      swift: '["6.2", "6.3", "6.4"]'
      targets: |
        [
          "arm64-apple-macosx",
          "arm64-apple-ios-macabi",
          "arm64-apple-ios",
          "arm64-apple-ios-simulator",
          "arm64-apple-tvos",
          "arm64-apple-tvos-simulator",
          "arm64_32-apple-watchos",
          "arm64-apple-watchos-simulator",
          "arm64-apple-xros",
          "arm64-apple-xros-simulator"
        ]

  benchmarks-matrix:
    uses: sinoru/github-workflows/.github/workflows/matrix.yml@main
    with:
      swift: '["6.2", "6.3", "6.4"]'
      targets: '["arm64-apple-macosx"]'

  # `Benchmarks` is a package of its own, which nothing above opens, so this is the only place a
  # change to the library that breaks it is found before someone wants a measurement. That and a
  # failed run are all that fail here. No threshold is checked in, because a number means
  # something next to the number beside it, or next to a baseline from the same machine, and a
  # runner is a different machine every time: the numbers go on the run's summary page to be
  # read, not judged.
  benchmarks:
    needs: benchmarks-matrix
    name: Benchmarks · Swift ${{ matrix.swift }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: ${{ matrix.developer_dir }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.benchmarks-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - run: swift --version

      # Grouped by metric rather than by benchmark, so that each table holds one number for every
      # case and the cases can be read against each other. The log gets everything the harness
      # prints; the summary gets it from the first heading on, which leaves out whatever SwiftPM
      # said on the way to building it.
      #
      # Up to Swift 6.2 the harness counts allocations through jemalloc, which it expects to find
      # installed and a runner does not have. It is told to do without rather than given one:
      # what this job is for is finding out that the benchmarks still build and run, and the
      # other rows count allocations by a means of the harness's own. The variable is set here
      # and not in `env`, because the harness asks whether it is set, not what it is set to.
      - name: Run benchmarks
        working-directory: Benchmarks
        run: |
          set -o pipefail
          if [ "${{ matrix.swift }}" = "6.2" ]; then
            export BENCHMARK_DISABLE_JEMALLOC=1
          fi
          swift package benchmark --format markdown --no-progress --grouping metric | tee "$RUNNER_TEMP/benchmarks.md"
          sed -n '/^## Baseline/,$p' "$RUNNER_TEMP/benchmarks.md" >> "$GITHUB_STEP_SUMMARY"
